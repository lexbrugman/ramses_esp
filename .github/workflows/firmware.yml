name: Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded run must never finish last and replace a newer rolling release.
# Manual runs do not publish, so they get their own group and can neither
# cancel nor displace a push run. cleanup.yml joins the push group so pruning
# never races a build for the branch.
concurrency:
  group: firmware-${{ github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware (${{ matrix.target }})
    # A same-repo PR's head commit already gets a push run, whose checks the PR
    # shows too, so only PRs from forks need a run of their own.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [esp32s3]
    env:
      ESP_IDF_VERSION: 5.5.4
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The OTA channel tag must match the one "publish" below creates for this
      # branch, so a binary always tracks the repo and channel it was actually
      # built from (see FW_OTA_REPO/FW_OTA_CHANNEL in
      # components/ramses-network/CMakeLists.txt).
      - name: Determine version and OTA channel
        id: ver
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "channel=${GITHUB_REF_NAME//\//-}-latest" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v${{ env.ESP_IDF_VERSION }}
          target: ${{ matrix.target }}
          path: .
          extra_docker_args: >-
            -e FW_VERSION=${{ steps.ver.outputs.version }}
            -e FW_OTA_REPO=${{ github.repository }}
            -e FW_OTA_CHANNEL=${{ steps.ver.outputs.channel }}

      - name: Merge binaries into single flash image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v${{ env.ESP_IDF_VERSION }}
          target: ${{ matrix.target }}
          path: .
          command: |
            cd build
            esptool.py --chip ${{ matrix.target }} merge_bin -o ramses_esp_${{ matrix.target }}_full.bin @flash_args

      # The build steps run in a container as root, so dist/ must be created
      # here on the runner for it to be writable.
      # ramses_esp_<target>.bin is the app-only image OTA flashes;
      # ramses_esp_<target>_full.bin adds the bootloader and partition table
      # and is flashed at 0x0 for a first install over USB.
      - name: Stage release assets
        run: |
          mkdir -p dist
          cp build/ramses_esp.bin dist/ramses_esp_${{ matrix.target }}.bin
          cp build/ramses_esp_${{ matrix.target }}_full.bin dist/
          echo -n "${{ steps.ver.outputs.version }}" > dist/version.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}-${{ steps.ver.outputs.version }}
          path: dist/

  publish:
    name: Publish rolling release (OTA channel)
    if: github.event_name == 'push' && github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*-${{ needs.build.outputs.version }}
          path: dist
          merge-multiple: true

      # Devices poll a fixed per-branch channel URL for their own target's
      # asset, e.g.
      #   .../releases/download/main-latest/ramses_esp_esp32s3.bin
      # so OTA always serves the newest build for the branch they track —
      # production devices follow "main-latest", test devices can be pointed
      # at a feature branch's "<branch>-latest" channel (see
      # components/ramses-network/CMakeLists.txt).
      # Only the default branch's channel gets GitHub's "Latest" badge, so
      # feature-branch pushes never steal it from the production channel.
      - name: Publish "<branch>-latest" release
        run: |
          tag="${GITHUB_REF_NAME//\//-}-latest"
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            latest=true
          else
            latest=false
          fi
          gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$tag" dist/*.bin dist/version.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag (OTA channel)" \
            --notes "Rolling OTA channel for branch \`$GITHUB_REF_NAME\` — devices poll this fixed URL; CI overwrites it on every push. Built from ${GITHUB_SHA:0:7} (version ${{ needs.build.outputs.version }})." \
            --latest=$latest

      # Alongside the rolling channel above (which devices poll and CI
      # overwrites every push), keep one untouched release per build so past
      # firmware versions stay browsable/downloadable. Tagged by
      # branch+timestamp+commit so it never collides with — or gets cleaned
      # up by — the rolling tag: the commit makes the tag unique, and the
      # UTC commit-date stamp makes tags sort chronologically (GitHub's
      # releases page orders by name, which is random for bare short SHAs;
      # "latest" sorts above any digit, so the rolling channel stays on top
      # of its branch's archives). cleanup.yml parses this tag format when
      # pruning a deleted branch's releases — keep the two in sync.
      # Only the default branch is archived: it's the audit trail of firmware
      # production devices may have run, while feature-branch builds are
      # throwaway (their rolling channel above is all a test device needs).
      # --latest=false keeps GitHub's "Latest" badge on the default branch's
      # OTA channel rather than letting it jump to whichever release was
      # created last.
      - name: Archive this build's release
        if: github.ref_name == github.event.repository.default_branch
        run: |
          stamp="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d-%H%M%S "$GITHUB_SHA")"
          tag="${GITHUB_REF_NAME//\//-}-$stamp-${{ needs.build.outputs.version }}"
          # A re-run for the same commit replaces its own archive.
          gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$tag" dist/*.bin dist/version.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag (build history)" \
            --notes "Archived build for branch \`$GITHUB_REF_NAME\` — commit ${GITHUB_SHA:0:7} (version ${{ needs.build.outputs.version }}). Not an OTA channel; devices don't poll this." \
            --latest=false
